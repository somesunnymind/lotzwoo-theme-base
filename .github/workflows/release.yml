name: Build Theme Release

# Kein Tag-Praefix: ein Repo, ein Theme, ein Namensraum.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

# Schreibrecht braucht nur der letzte Schritt. Der Token liegt deshalb nicht
# in der Arbeitskopie (`persist-credentials: false`) und erreicht nur diesen
# Schritt, und dort laeuft keine fremde Action, sondern `gh`.
permissions:
  contents: write

jobs:
  build:
    name: Build release ZIP
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Torwaechter 1. Ein Tag, der dem Header widerspricht, liefert ein Update
      # aus, das jede Installation sieht und nie erfuellt: der Kern vergleicht
      # die Release-Version gegen den installierten Header, also laesst ein Tag
      # 9.9.9 auf `Version: 0.2.0` jede Site dauerhaft "Update verfuegbar"
      # melden.
      - name: Tag gegen den Theme-Header pruefen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^[[:space:]]*Version:[[:space:]]*\([0-9][^[:space:]]*\).*/\1/p' \
            style.css | head -n 1)
          if [ -z "$header" ]; then
            echo "Kein 'Version:'-Header in style.css" >&2
            exit 1
          fi
          if [ "$tag" != "$header" ]; then
            echo "Tag '$tag' passt nicht zu 'Version: $header'" >&2
            exit 1
          fi
          echo "Tag und Header stimmen ueberein: $header"

      # Das Praefix ist nicht Kosmetik: `Theme_Upgrader::check_package()`
      # verlangt `style.css` im *einen* Unterverzeichnis des ZIP, und der
      # Verzeichnisname wird zum Stylesheet-Namen. Heisst er anders als
      # `lotzwoo-theme-base`, verliert das Kindtheme sein Elterntheme.
      - name: ZIP bauen
        run: |
          mkdir -p build
          git archive --format=zip \
            --prefix=lotzwoo-theme-base/ \
            -o build/lotzwoo-theme-base.zip \
            HEAD

      # Torwaechter 2: die check_package-Bedingungen, gegen das Paket, das
      # tatsaechlich ausgeliefert wird.
      - name: Gebautes ZIP gegen check_package pruefen
        run: |
          cd build
          unzip -l lotzwoo-theme-base.zip

          for required in \
            lotzwoo-theme-base/style.css \
            lotzwoo-theme-base/theme.json \
            lotzwoo-theme-base/functions.php \
            lotzwoo-theme-base/inc/updater.php \
            lotzwoo-theme-base/LICENSE \
            lotzwoo-theme-base/assets/fonts/OFL.txt \
            lotzwoo-theme-base/templates/index.html; do
            unzip -l lotzwoo-theme-base.zip "$required" > /dev/null \
              || { echo "Fehlt im ZIP: $required" >&2; exit 1; }
          done

          for excluded in \
            'lotzwoo-theme-base/.github/*' \
            'lotzwoo-theme-base/scripts/*' \
            'lotzwoo-theme-base/README.md' \
            'lotzwoo-theme-base/CONTRIBUTING.md' \
            'lotzwoo-theme-base/package.json' \
            'lotzwoo-theme-base/package-lock.json'; do
            if unzip -l lotzwoo-theme-base.zip "$excluded" > /dev/null 2>&1; then
              echo "Gehoert nicht ins ZIP: $excluded" >&2
              exit 1
            fi
          done

          # Genau ein Unterverzeichnis in der Wurzel des ZIP.
          roots=$(unzip -Z1 lotzwoo-theme-base.zip | cut -d/ -f1 | sort -u | wc -l)
          if [ "$roots" -ne 1 ]; then
            echo "ZIP hat $roots Wurzelverzeichnisse, check_package verlangt eines" >&2
            exit 1
          fi

          # Theme Name darf nicht leer sein.
          unzip -p lotzwoo-theme-base.zip lotzwoo-theme-base/style.css \
            | grep -qE '^[[:space:]]*Theme Name:[[:space:]]*\S' \
            || { echo "Leerer 'Theme Name' im ZIP" >&2; exit 1; }

      # Torwaechter 3: was beim Kunden ankommt, gegen die Sperrliste. Die Liste
      # und das Skript liegen unter `scripts/` und sind nicht im ZIP, deshalb
      # aus dem Checkout.
      - name: Gebautes ZIP gegen die Sperrliste pruefen
        run: node scripts/check-sperrliste.mjs --zip build/lotzwoo-theme-base.zip

      # Legt das Release zum Tag an, falls es noch keines gibt, und haengt das
      # ZIP an. Der Updater sucht genau den Asset-Namen `lotzwoo-theme-base.zip`.
      - name: ZIP an das Release haengen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" build/lotzwoo-theme-base.zip --repo "$GITHUB_REPOSITORY" --clobber
