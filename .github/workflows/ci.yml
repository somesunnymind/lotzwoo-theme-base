name: Checks

# Fuenf Pruefungen, alle **ohne** WordPress. Absichtlich kein Theme Check per
# `wp-env`: das faehrt ein ganzes WordPress in Docker hoch, um Regeln zu
# pruefen, die fuer ein Verzeichnis gelten, in das dieses Theme nie eingereicht
# wird.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Theme-Pruefungen
    runs-on: ubuntu-latest

    steps:
      # Beide Actions laufen ab diesen Hauptversionen auf der node24-Laufzeit.
      # v4 lief auf node20 und meldete die Abkuendigung bei jedem Lauf.
      - uses: actions/checkout@v7

      # `node-version` ist eine andere Achse als die Laufzeit der Action: hier
      # steht, womit die Pruefungen unten laufen, nicht womit setup-node selbst
      # laeuft. Bleibt vorerst 20 -- das ist eine eigene Entscheidung.
      #
      # Seit setup-node v5 wird automatisch zwischengespeichert, sobald
      # `package.json` ein `packageManager`-Feld traegt. Dieses hier hat keines,
      # also aendert sich am Verhalten nichts.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Werkzeug installieren
        run: npm install --no-audit --no-fund

      # 1 + 2: theme.json gegen das versionierte Kernschema.
      - name: theme.json gegen das Kernschema
        run: npm run check:theme-json

      # 3: Header-Vollstaendigkeit, plus die Klammer zwischen
      #    theme.json-Version und "Requires at least".
      - name: Theme-Header
        run: npm run check:headers

      # 4: PHP-Syntax. Eine Datei, aber sie laedt auf jeder Seite.
      - name: PHP-Syntax
        run: |
          shopt -s globstar nullglob
          for file in **/*.php; do
            php -l "$file"
          done

      # 5: Blockmarkup wohlgeformt.
      - name: Blockmarkup
        run: npm run check:blocks
