name: Checks

# Alle Pruefungen laufen **ohne** WordPress. Absichtlich kein Theme Check per
# `wp-env`: das faehrt ein ganzes WordPress in Docker hoch, um Regeln zu
# pruefen, die fuer ein Verzeichnis gelten, in das dieses Theme nie eingereicht
# wird.

on:
  push:
    branches: [main]
  pull_request:

# Nur lesen. Keine Pruefung hier schreibt ins Repo.
permissions:
  contents: read

jobs:
  checks:
    name: Theme-Pruefungen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `node-version` ist die Fassung, mit der die Pruefungen laufen, nicht
      # die Laufzeit der Action. Eine LTS-Fassung; `engines` in der
      # `package.json` fordert nichts.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `npm ci` installiert genau, was in `package-lock.json` steht.
      - name: Werkzeug installieren
        run: npm ci --no-audit --no-fund

      # 1 + 2: theme.json gegen das versionierte Kernschema.
      - name: theme.json gegen das Kernschema
        run: npm run check:theme-json

      # 3: Header-Vollstaendigkeit, plus die Klammer zwischen
      #    theme.json-Version und "Requires at least".
      - name: Theme-Header
        run: npm run check:headers

      # 4: PHP-Syntax. `functions.php` laedt auf jeder Seite.
      - name: PHP-Syntax
        run: |
          shopt -s globstar nullglob
          for file in **/*.php; do
            php -l "$file"
          done

      # 5: Blockmarkup wohlgeformt.
      - name: Blockmarkup
        run: npm run check:blocks

      # 6: keine Kunden- und Personennamen, Serverpfade, Arbeitskuerzel oder
      #    Datumsangaben im Repo.
      - name: Sperrliste
        run: npm run check:sperrliste

      # 7: der Update-Weg, ohne WordPress und ohne Netz.
      - name: Updater
        run: php scripts/check-updater.php
